<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Hospital{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Sistema de gestión de un hospital</a>
            {% if user.is_authenticated %}
            <form method="post" action="{% url 'logout' %}" class="d-flex align-items-center">
                {% csrf_token %}
                <span class="text-white me-3">{{ user.username }}</span>
                <button type="submit" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
            </form>
            {% endif %}
        </div>
    </nav>
    <div class="container">
        {% if messages %}
        {% for mensaje in messages %}
        <div class="alert {% if mensaje.tags == 'error' %}alert-danger{% else %}alert-success{% endif %}">{{ mensaje }}</div>
        {% endfor %}
        {% endif %}
        {% block contenido %}{% endblock %}
    </div>
</body>
</html>
