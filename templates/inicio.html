{% extends 'base.html' %}

{% block titulo %}Inicio{% endblock %}

{% block contenido %}
<div class="card shadow-sm">
    <div class="card-body">
        <h1 class="h3">Bienvenido, {{ user.username }}</h1>
        <p class="mb-1">Tu rol:
            {% for grupo in grupos %}
                <span class="badge bg-secondary">{{ grupo }}</span>
            {% empty %}
                <span class="text-muted">Sin rol asignado</span>
            {% endfor %}
        </p>
    </div>
</div>
{% endblock %}
